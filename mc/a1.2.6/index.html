
<!DOCTYPE html>
<html>
  <head>
    <title>Eaglercraft Alpha 1.2.6</title>
    <link type="image/png" rel="shortcut icon" href="https://raw.githubusercontent.com/procatsrandomsources/CocoClient/refs/heads/main/coconut.png">
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <script type="text/javascript" charset="utf-8" src="js/app.js"></script>
    <script type = text/javascript>
		window.addEventListener("load", function() {
			window.config = {
				gameContainer: "game", assetsLocation: "resources.mc", playerUsername: null, serverIP: null, joinServerOnLaunch: false,
				servers: [
					{ addr: "java://mc.coconutsmp.qzz.io", name: "Coconut#1" },
					{ addr: "java://play.coconutsmp.qzz.io", name: "Coconut#2" }
				]
			};
			main();
		});

	    document.esc = false;
	    document.addEventListener('keydown', function(e) {
  		if (e.key === 'Escape') {
			e.preventDefault();
    			document.esc = true;
  		}
	    });

	    document.addEventListener('keyup', function(e) {
  		if (e.key === 'Escape') {
			e.preventDefault();
    			document.esc = false;
  		}
	    });
        </script>
  </head>
<body style="margin:0px;width:100vw;height:100vh;" id="game">
</body>
</html>
